name: "StartOS SDK"
description: "Provides start-cli"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install dependencies
      run: |
        set -euxo pipefail
        # Remove broken Microsoft repo if present to avoid apt errors
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          squashfs-tools-ng \
          qemu-user-static
        sudo apt-get clean
      shell: bash

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install start-cli
      run: |
        set -euxo pipefail
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        if [ "$OS" = "darwin" ]; then
          OS=macos
        fi

        BINARY_NAME="start-cli_${ARCH}-${OS}"

        # Fetch latest release asset URL (unchanged behavior)
        LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/Start9Labs/start-os/releases \
          | jq -r '.[0].assets[] | select(.name=="'"$BINARY_NAME"'") | .browser_download_url')

        if [ -z "$LATEST_RELEASE_URL" ] || [ "$LATEST_RELEASE_URL" = "null" ]; then
          echo "Could not find asset $BINARY_NAME in latest start-cli release"
          exit 1
        fi

        curl -L "$LATEST_RELEASE_URL" -o /usr/local/bin/start-cli
        chmod +x /usr/local/bin/start-cli
      shell: bash
